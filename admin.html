<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>অ্যাডমিন প্যানেল - কাঠের হিসাব</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #F5EDE2, #EAD9C4);
    min-height: 100vh;
    padding: 20px 12px 60px;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 24px 18px;
    width: 100%;
    max-width: 480px;
    margin: 0 auto 16px;
    box-shadow: 0 8px 32px rgba(140,74,54,0.15);
  }
  .logo { text-align:center; font-size:40px; margin-bottom:4px; }
  h2 { text-align:center; font-size:19px; color:#8B3A0F; margin-bottom:4px; }
  p.sub { text-align:center; font-size:12.5px; color:#8a7a68; margin-bottom:16px; }
  .field { margin-bottom: 14px; }
  .field label { display:block; font-size:12px; color:#8a7a68; margin-bottom:4px; font-weight:600; }
  .field input, textarea {
    width:100%; padding:12px 14px; border:1.5px solid #e0cfb8; border-radius:10px;
    font-size:14px; background:#FBF5EC; color:#3a2c1e; font-family:inherit;
  }
  textarea { resize:vertical; min-height:80px; }
  .field input:focus, textarea:focus { outline:none; border-color:#C8820A; }
  .btn {
    width:100%; padding:13px; border:none; border-radius:10px; font-size:15px;
    font-weight:700; cursor:pointer; margin-top:6px;
  }
  .btn-primary { background:#8B3A0F; color:#fff; }
  .btn-primary:disabled { opacity:0.6; }
  .btn-small { width:auto; padding:6px 12px; font-size:12px; border-radius:7px; cursor:pointer; border:none; font-weight:700; }
  .btn-block { background:#c0392b; color:#fff; }
  .btn-unblock { background:#1e8449; color:#fff; }
  .btn-del { background:#c0392b; color:#fff; }
  .msg { text-align:center; font-size:13px; font-weight:600; margin-top:12px; min-height:18px; }
  .msg.err { color:#c0392b; }
  .msg.ok { color:#1e8449; }
  hr { border:none; border-top:1px solid #eee0d0; margin:20px 0; }
  .section-title { font-size:13px; font-weight:700; color:#8B3A0F; margin-bottom:10px; }
  .stat-box { background:#FBF5EC; border-radius:12px; padding:14px; text-align:center; margin-bottom:16px; }
  .stat-num { font-size:28px; font-weight:800; color:#8B3A0F; }
  .stat-label { font-size:12px; color:#8a7a68; }
  .refresh-link { display:inline-block; font-size:12px; color:#8B3A0F; font-weight:700; cursor:pointer; margin-bottom:10px; }
  .user-row {
    border:1px solid #f0e6d8; border-radius:10px; padding:10px 12px; margin-bottom:8px;
    font-size:12.5px; background:#FFFDF9;
  }
  .user-row-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .user-row-name { font-weight:700; color:#3a2c1e; }
  .user-row-phone { color:#8a7a68; }
  .user-row-meta { color:#a99a86; font-size:11px; margin-top:2px; }
  .user-row-actions { display:flex; gap:6px; margin-top:8px; align-items:center; }
  .badge-blocked { background:#c0392b; color:#fff; font-size:10.5px; padding:2px 7px; border-radius:6px; font-weight:700; }
  .badge-active { background:#1e8449; color:#fff; font-size:10.5px; padding:2px 7px; border-radius:6px; font-weight:700; }
  .notif-list-item {
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    background:#FBF5EC; border-radius:8px; padding:8px 10px; margin-bottom:6px; font-size:12.5px;
  }
  .checkbox-row { display:flex; align-items:center; gap:6px; margin-bottom:8px; }
</style>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="card" id="loginCard">
  <div class="logo">🔧</div>
  <h2>অ্যাডমিন প্যানেল</h2>
  <p class="sub">কাঠের হিসাব — ব্যবস্থাপনা</p>
  <div class="field">
    <label>🔐 অ্যাডমিন পাসওয়ার্ড</label>
    <input type="password" id="adminPwInput" placeholder="পাসওয়ার্ড দিন" onkeydown="if(event.key==='Enter') adminUnlock()">
  </div>
  <button class="btn btn-primary" onclick="adminUnlock()">🔓 প্রবেশ করুন</button>
  <div class="msg err" id="loginMsg"></div>
</div>

<div id="dashboard" style="display:none;">

<div class="card">
  <div class="stat-box">
    <div class="stat-num" id="statTotalUsers">--</div>
    <div class="stat-label">মোট রেজিস্টার্ড ইউজার</div>
  </div>
  <div class="section-title">👥 ইউজার লিস্ট</div>
  <span class="refresh-link" onclick="loadUsers()">🔄 রিফ্রেশ করুন</span>
  <div id="userListMsg" class="msg"></div>
  <div id="userList"></div>
</div>

<div class="card">
  <div class="section-title" style="cursor:pointer;" onclick="toggleResetSection()">📞 নির্দিষ্ট ইউজারের পাসওয়ার্ড রিসেট (চাপুন) ▾</div>
  <div id="resetSection" style="display:none;">
  <div class="field">
    <label>ইউজারের ফোন নম্বর</label>
    <input type="tel" id="targetPhone" placeholder="01712345678" inputmode="numeric" maxlength="15">
  </div>
  <div class="field">
    <label>নতুন পাসওয়ার্ড (শব্দ অথবা নাম্বার)</label>
    <input type="password" id="newPin" placeholder="নতুন পাসওয়ার্ড দিন" maxlength="20">
  </div>
  <div class="field">
    <label>নতুন পাসওয়ার্ড আবার লিখুন</label>
    <input type="password" id="newPinConfirm" placeholder="নতুন পাসওয়ার্ড আবার লিখুন" maxlength="20">
  </div>
  <button class="btn btn-primary" id="resetBtn" onclick="doReset()">✅ পাসওয়ার্ড রিসেট করুন</button>
  <div class="msg" id="resetMsg"></div>
  </div>
</div>

<div class="card">
  <div class="section-title">🔔 নোটিফিকেশন পাঠান</div>
  <p class="sub" style="margin-bottom:10px;">উপরের ইউজার লিস্ট থেকে টিক দিলে শুধু তাদের কাছে যাবে। কাউকে টিক না দিলে সবাই পাবে।</p>
  <div class="field">
    <textarea id="notifMsg" placeholder="নোটিফিকেশনের লেখা লিখুন..."></textarea>
  </div>
  <button class="btn btn-primary" id="sendNotifBtn" onclick="sendNotification()">📢 পাঠান</button>
  <div class="msg" id="notifMsgBox"></div>
  <hr>
  <div class="section-title">পাঠানো নোটিফিকেশনসমূহ</div>
  <span class="refresh-link" onclick="loadNotifications()">🔄 রিফ্রেশ করুন</span>
  <div id="notifList"></div>
</div>

</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBTddK_2tWHyc5bheIAnMukSQGV9JxL754",
    authDomain: "katherhishabapp.firebaseapp.com",
    projectId: "katherhishabapp",
    storageBucket: "katherhishabapp.firebasestorage.app",
    messagingSenderId: "267868755262",
    appId: "1:267868755262:web:f2d69d3fdac3476305486f",
    measurementId: "G-BZ2WNCSKQY"
  };

  let db = null;
  let cloudEnabled = true;
  try {
    if (typeof firebase === 'undefined') throw new Error('Firebase SDK লোড হয়নি');
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  } catch (e) {
    cloudEnabled = false;
    console.warn('Firebase init failed:', e);
  }

  const selectedPhones = new Set();
  let adminPassword = '';

  function normalizePhone(v) { return (v || '').replace(/\D/g, ''); }

  async function sha256(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function getAdminHash() {
    return sha256('kh_admin_salt::' + adminPassword);
  }

  function toggleResetSection() {
    const sec = document.getElementById('resetSection');
    sec.style.display = sec.style.display === 'none' ? 'block' : 'none';
  }

  function adminUnlock() {
    const pw = document.getElementById('adminPwInput').value;
    const msgEl = document.getElementById('loginMsg');
    if (!pw) { msgEl.textContent = 'পাসওয়ার্ড দিন'; return; }
    if (!cloudEnabled || !db) { msgEl.textContent = 'ইন্টারনেট সংযোগ নেই। ইন্টারনেট চালু করে আবার চেষ্টা করুন।'; return; }
    adminPassword = pw;
    msgEl.textContent = '';
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadUsers();
    loadNotifications();
  }

  function fmtDate(ts) {
    if (!ts) return '—';
    try {
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleDateString('bn-BD') + ' ' + d.toLocaleTimeString('bn-BD', {hour:'2-digit', minute:'2-digit'});
    } catch (e) { return '—'; }
  }

  // ===== Load & render users =====
  function loadUsers() {
    if (!cloudEnabled || !db) { document.getElementById('userListMsg').textContent = 'ইন্টারনেট সংযোগ নেই।'; document.getElementById('userListMsg').className='msg err'; return; }
    document.getElementById('userListMsg').textContent = 'লোড হচ্ছে...';
    document.getElementById('userListMsg').className = 'msg';
    db.collection('users').get().then(function (snap) {
      document.getElementById('statTotalUsers').textContent = snap.size;
      const listEl = document.getElementById('userList');
      listEl.innerHTML = '';
      selectedPhones.clear();
      if (snap.empty) {
        listEl.innerHTML = '<p style="font-size:12.5px;color:#8a7a68;text-align:center;">কোনো ইউজার নেই।</p>';
      }
      snap.forEach(function (doc) {
        const d = doc.data();
        const phone = doc.id;
        const isBlocked = d.blocked === true;
        const row = document.createElement('div');
        row.className = 'user-row';
        row.innerHTML =
          '<div class="user-row-top">' +
            '<div>' +
              '<div class="checkbox-row"><input type="checkbox" onchange="toggleSelect(\'' + phone + '\', this.checked)"> ' +
              '<span class="user-row-name">' + escapeHtml(d.name || '(নাম নেই)') + '</span></div>' +
              '<div class="user-row-phone">📞 ' + escapeHtml(phone) + '</div>' +
              '<div class="user-row-meta">যোগ দিয়েছেন: ' + fmtDate(d.createdAt) + '</div>' +
              '<div class="user-row-meta">সর্বশেষ ব্যবহার: ' + fmtDate(d.lastActive) + '</div>' +
            '</div>' +
            '<span class="' + (isBlocked ? 'badge-blocked' : 'badge-active') + '">' + (isBlocked ? 'ব্লকড' : 'সচল') + '</span>' +
          '</div>' +
          '<div class="user-row-actions">' +
            '<button class="btn-small ' + (isBlocked ? 'btn-unblock' : 'btn-block') + '" onclick="toggleBlock(\'' + phone + '\', ' + isBlocked + ', this)">' +
              (isBlocked ? '✅ আনব্লক করুন' : '🚫 ব্লক করুন') +
            '</button>' +
          '</div>';
        listEl.appendChild(row);
      });
      document.getElementById('userListMsg').textContent = '';
    }).catch(function (e) {
      document.getElementById('userListMsg').textContent = 'লোড ব্যর্থ: ' + (e && e.message ? e.message : e);
      document.getElementById('userListMsg').className = 'msg err';
    });
  }

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function toggleSelect(phone, checked) {
    if (checked) selectedPhones.add(phone); else selectedPhones.delete(phone);
  }

  async function toggleBlock(phone, currentlyBlocked, btnEl) {
    btnEl.disabled = true;
    try {
      const adminHash = await getAdminHash();
      await db.collection('adminReset').doc(phone + '_' + adminHash).set({ ts: firebase.firestore.FieldValue.serverTimestamp() });
      await db.collection('users').doc(phone).update({ blocked: !currentlyBlocked });
      loadUsers();
    } catch (e) {
      if (e && e.code === 'permission-denied') alert('অ্যাডমিন পাসওয়ার্ড ভুল।');
      else alert('সমস্যা: ' + (e && e.message ? e.message : e));
      btnEl.disabled = false;
    }
  }

  // ===== Reset PIN =====
  async function doReset() {
    const msgEl = document.getElementById('resetMsg');
    msgEl.textContent = ''; msgEl.className = 'msg';
    if (!cloudEnabled || !db) { msgEl.textContent = 'ইন্টারনেট সংযোগ নেই।'; msgEl.className = 'msg err'; return; }

    const phone = normalizePhone(document.getElementById('targetPhone').value);
    const pin = document.getElementById('newPin').value.trim();
    const pinConfirm = document.getElementById('newPinConfirm').value.trim();

    if (phone.length < 6) { msgEl.textContent = 'সঠিক ফোন নম্বর দিন'; msgEl.className = 'msg err'; return; }
    if (pin.length < 4 || pin.length > 20) { msgEl.textContent = 'পাসওয়ার্ড অন্তত ৪ অক্ষর/সংখ্যা হতে হবে'; msgEl.className = 'msg err'; return; }
    if (pin !== pinConfirm) { msgEl.textContent = 'দুইবার একই পাসওয়ার্ড দিন'; msgEl.className = 'msg err'; return; }

    const btn = document.getElementById('resetBtn');
    btn.disabled = true; btn.textContent = 'যাচাই করা হচ্ছে...';
    try {
      const userDoc = await db.collection('users').doc(phone).get();
      if (!userDoc.exists) {
        msgEl.textContent = 'এই নম্বরে কোনো অ্যাকাউন্ট নেই।'; msgEl.className = 'msg err';
        btn.disabled = false; btn.textContent = '✅ পাসওয়ার্ড রিসেট করুন'; return;
      }
      const adminHash = await getAdminHash();
      const newPinHash = await sha256(phone + ':' + pin);
      await db.collection('adminReset').doc(phone + '_' + adminHash).set({ ts: firebase.firestore.FieldValue.serverTimestamp() });
      await db.collection('users').doc(phone).update({ pinHash: newPinHash });
      msgEl.textContent = '✅ সফলভাবে পাসওয়ার্ড রিসেট হয়েছে!'; msgEl.className = 'msg ok';
      document.getElementById('newPin').value = '';
      document.getElementById('newPinConfirm').value = '';
    } catch (e) {
      if (e && e.code === 'permission-denied') { msgEl.textContent = '❌ অ্যাডমিন পাসওয়ার্ড ভুল।'; }
      else { msgEl.textContent = 'সমস্যা: ' + (e && e.message ? e.message : e); }
      msgEl.className = 'msg err';
    }
    btn.disabled = false; btn.textContent = '✅ পাসওয়ার্ড রিসেট করুন';
  }

  // ===== Notifications =====
  async function sendNotification() {
    const msgEl = document.getElementById('notifMsgBox');
    msgEl.textContent = ''; msgEl.className = 'msg';
    if (!cloudEnabled || !db) { msgEl.textContent = 'ইন্টারনেট সংযোগ নেই।'; msgEl.className = 'msg err'; return; }

    const text = document.getElementById('notifMsg').value.trim();
    if (!text) { msgEl.textContent = 'নোটিফিকেশনের লেখা দিন'; msgEl.className = 'msg err'; return; }

    const btn = document.getElementById('sendNotifBtn');
    btn.disabled = true; btn.textContent = 'পাঠানো হচ্ছে...';
    try {
      const adminHash = await getAdminHash();
      const targetPhones = Array.from(selectedPhones);
      await db.collection('adminReset').doc('notif_' + adminHash).set({ ts: firebase.firestore.FieldValue.serverTimestamp() });
      await db.collection('notifications').add({
        message: text,
        targetPhones: targetPhones,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      msgEl.textContent = targetPhones.length > 0
        ? ('✅ ' + targetPhones.length + ' জন ইউজারকে পাঠানো হয়েছে।')
        : '✅ সবাইকে পাঠানো হয়েছে।';
      msgEl.className = 'msg ok';
      document.getElementById('notifMsg').value = '';
      loadNotifications();
    } catch (e) {
      if (e && e.code === 'permission-denied') { msgEl.textContent = '❌ অ্যাডমিন পাসওয়ার্ড ভুল।'; }
      else { msgEl.textContent = 'সমস্যা: ' + (e && e.message ? e.message : e); }
      msgEl.className = 'msg err';
    }
    btn.disabled = false; btn.textContent = '📢 পাঠান';
  }

  function loadNotifications() {
    if (!cloudEnabled || !db) return;
    db.collection('notifications').orderBy('createdAt', 'desc').limit(20).get().then(function (snap) {
      const listEl = document.getElementById('notifList');
      listEl.innerHTML = '';
      if (snap.empty) {
        listEl.innerHTML = '<p style="font-size:12.5px;color:#8a7a68;">কোনো নোটিফিকেশন নেই।</p>';
        return;
      }
      snap.forEach(function (doc) {
        const d = doc.data();
        const item = document.createElement('div');
        item.className = 'notif-list-item';
        const targets = (d.targetPhones && d.targetPhones.length > 0) ? (d.targetPhones.length + ' জন নির্দিষ্ট ইউজার') : 'সবাই';
        item.innerHTML = '<span>🔔 ' + escapeHtml(d.message || '') + '<br><small style="color:#a99a86;">' + fmtDate(d.createdAt) + ' • ' + targets + '</small></span>' +
          '<button class="btn-del" onclick="deleteNotification(\'' + doc.id + '\', this)">মুছুন</button>';
        listEl.appendChild(item);
      });
    }).catch(function (e) { console.warn('notif list load failed', e); });
  }

  async function deleteNotification(id, btnEl) {
    btnEl.disabled = true;
    try {
      const adminHash = await getAdminHash();
      await db.collection('adminReset').doc('notif_' + adminHash).set({ ts: firebase.firestore.FieldValue.serverTimestamp() });
      await db.collection('notifications').doc(id).delete();
      loadNotifications();
    } catch (e) {
      if (e && e.code === 'permission-denied') alert('অ্যাডমিন পাসওয়ার্ড ভুল।');
      else alert('সমস্যা: ' + (e && e.message ? e.message : e));
      btnEl.disabled = false;
    }
  }

</script>
</body>
</html>
